apiVersion: apps/v1
kind: Deployment
metadata:
  name: printer-agent-server-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: printer-agent-server

  template:
    metadata:
      labels:
        app: printer-agent-server

    spec:
      containers:
        - name: printer-agent-server
          image: jeongwoomyeong/printer-agent-server:latest

          ports:
            - containerPort: 8088

          env:
            - name: POP_SERVER_URL
              value: "http://myapp-service:8081"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"
